server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/ttf;
    gzip_min_length 1024;

    # assets con hash en el nombre (Vite): cachear largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # imágenes/brand: mismo criterio, no cambian de contenido sin cambiar de nombre
    location ~* \.(webp|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html: nunca cachear, es lo único que cambia entre despliegues
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
